<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="error" class="error" hidden></div>
	<div class="row">
		<label>Device</label>
		<select id="device"></select>
	</div>
	<div class="row">
		<label>Step size</label>
		<input type="number" id="step" min="25" max="500" step="25" value="100">
		<div class="value">K per tick</div>
	</div>
	<div class="row">
		<label>Reset to</label>
		<input type="number" id="defaultK" min="2900" max="7000" step="50" value="4500">
		<div class="value">K</div>
	</div>
	<div class="note">Rotate the dial to adjust color temperature (2900–7000K). Press the dial (or tap the touchscreen) to reset to the default value above.</div>

	<script src="common.js"></script>
	<script>
		const $device   = document.getElementById('device');
		const $step     = document.getElementById('step');
		const $defaultK = document.getElementById('defaultK');
		const $err      = document.getElementById('error');

		PI.on('devices', (msg) => {
			$err.hidden = msg.devices.length > 0;
			$err.textContent = 'No Key Lights found yet. Check they are powered and on the network, or add their IPs below.';
			PI.fillDeviceSelect($device, msg.devices, PI.getSettings());
		});

		PI.on('settings', (s) => {
			$step.value     = s.step     != null ? s.step     : 100;
			$defaultK.value = s.defaultK != null ? s.defaultK : 4500;
		});

		function save() {
			const s = PI.getSettings();
			s.deviceId = $device.value;
			s.step     = parseInt($step.value, 10) || 100;
			s.defaultK = parseInt($defaultK.value, 10) || 4500;
			PI.saveSettings(s);
		}

		$device.addEventListener('change', save);
		$step.addEventListener('change', save);
		$defaultK.addEventListener('change', save);
	</script>
</body>
</html>
