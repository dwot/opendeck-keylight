<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="error" class="error" hidden></div>
	<div class="row">
		<label>Device</label>
		<select id="device"></select>
	</div>
	<div class="row checkbox">
		<input type="checkbox" id="showBrightness">
		<label for="showBrightness" style="flex:1;">Show brightness % on key when on</label>
	</div>
	<div class="note">"All lights" toggles every discovered Key Light at once.</div>

	<script src="common.js"></script>
	<script>
		const $device = document.getElementById('device');
		const $err = document.getElementById('error');
		const $showB = document.getElementById('showBrightness');

		PI.on('devices', (msg) => {
			$err.hidden = msg.devices.length > 0;
			$err.textContent = 'No Key Lights found yet. Check they are powered and on the network, or add their IPs below.';
			PI.fillDeviceSelect($device, msg.devices, PI.getSettings());
		});

		PI.on('settings', (s) => {
			$showB.checked = !!s.showBrightness;
		});

		$device.addEventListener('change', () => {
			const s = PI.getSettings();
			s.deviceId = $device.value;
			PI.saveSettings(s);
		});
		$showB.addEventListener('change', () => {
			const s = PI.getSettings();
			s.showBrightness = $showB.checked;
			PI.saveSettings(s);
		});
	</script>
</body>
</html>
