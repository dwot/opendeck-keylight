<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="error" class="error" hidden></div>
	<div class="row">
		<label>Device</label>
		<select id="device"></select>
	</div>
	<div class="row checkbox">
		<input type="checkbox" id="showBrightness">
		<label for="showBrightness" style="flex:1;">Show brightness % on key when on</label>
	</div>
	<div class="note">"All lights" toggles every discovered Key Light at once.</div>

	<script src="common.js"></script>
	<script>
		const $device = document.getElementById('device');
		const $err = document.getElementById('error');
		const $showB = document.getElementById('showBrightness');

		function populateDevices(devices, settings) {
			$device.innerHTML = '';
			const all = document.createElement('option');
			all.value = '__ALL__';
			all.textContent = 'All lights';
			$device.appendChild(all);
			for (const d of devices) {
				const opt = document.createElement('option');
				opt.value = String(d.index);  // index is more stable across PI sessions than MAC
				opt.textContent = `${d.name} (${d.ip})`;
				$device.appendChild(opt);
			}
			if (settings.deviceId != null) $device.value = String(settings.deviceId);
			else $device.value = '__ALL__';
		}

		PI.on('devices', (msg) => {
			if (!msg.ok) {
				$err.hidden = false;
				$err.textContent = 'Could not reach keylight-control. Is it running? ' + (msg.error || '');
			} else {
				$err.hidden = true;
				populateDevices(msg.devices, PI.getSettings());
			}
		});

		PI.on('settings', (s) => {
			$showB.checked = !!s.showBrightness;
		});

		$device.addEventListener('change', () => {
			const s = PI.getSettings();
			s.deviceId = $device.value;
			PI.saveSettings(s);
		});
		$showB.addEventListener('change', () => {
			const s = PI.getSettings();
			s.showBrightness = $showB.checked;
			PI.saveSettings(s);
		});
	</script>
</body>
</html>
