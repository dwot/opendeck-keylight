<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="error" class="error" hidden></div>
	<div class="row">
		<label>Device</label>
		<select id="device"></select>
	</div>
	<div class="row">
		<label>Step size</label>
		<input type="number" id="step" min="1" max="50" step="1" value="5">
		<div class="value">% per tick</div>
	</div>
	<div class="note">Rotate the dial to adjust brightness. Press the dial (or tap the touchscreen) to toggle on/off.</div>

	<script src="common.js"></script>
	<script>
		const $device = document.getElementById('device');
		const $step   = document.getElementById('step');
		const $err    = document.getElementById('error');

		PI.on('devices', (msg) => {
			$err.hidden = msg.devices.length > 0;
			$err.textContent = 'No Key Lights found yet. Check they are powered and on the network, or add their IPs below.';
			PI.fillDeviceSelect($device, msg.devices, PI.getSettings());
		});

		PI.on('settings', (s) => {
			$step.value = s.step != null ? s.step : 5;
		});

		function save() {
			const s = PI.getSettings();
			s.deviceId = $device.value;
			s.step = parseInt($step.value, 10) || 5;
			PI.saveSettings(s);
		}

		$device.addEventListener('change', save);
		$step.addEventListener('change', save);
	</script>
</body>
</html>
