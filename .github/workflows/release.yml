# Tag-driven release: push `vX.Y.Z` (matching manifest.json Version) and this builds,
# validates and publishes one .streamDeckPlugin asset. OpenDeck's store installs the
# newest non-prerelease GitHub release and compares its tag to the manifest Version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check tag matches manifest Version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Elgato requires a 4-part manifest Version; OpenDeck ignores the 4th part.
          version="$(node -p "require('./manifest.json').Version.replace(/\\.0$/, '')")"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$version package=$pkg"
          [ "$tag" = "$version" ] || { echo "::error::tag v$tag != manifest Version $version"; exit 1; }
          [ "$pkg" = "$version" ] || { echo "::error::package.json version $pkg != manifest Version $version"; exit 1; }

      - name: Syntax check
        run: for f in bin/*.js; do node --check "$f"; done

      - name: Build
        run: ./build.sh

      - name: Validate with Elgato CLI
        run: npx -y @elgato/cli@1.10.1 validate dist/me.dwot.keylight.sdPlugin --no-update-check

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[?"v"\\]?" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG.md section for ${GITHUB_REF_NAME#v}"; exit 1; }

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.streamDeckPlugin
          body_path: notes.md
          fail_on_unmatched_files: true
